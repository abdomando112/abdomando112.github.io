# Site settings
# 用户主页（username.github.io）baseurl 必须为空字符串 ""。
# 如果以后部署成项目主页（如 username.github.io/academic-homepage），再改成 "/academic-homepage"。
baseurl: ""

# Build settings
markdown: kramdown
plugins:
  - jekyll-email-protect

# 你的时区（可选，取消注释即可）
# timezone: Asia/Shanghai

collections:
  - publications
  - news
  - showcase
  - posts
