name: Pages Deploy
on:
  push:
    branches: ["main"]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: gh-pages
  cancel-in-progress: false
jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.publish.outputs.page_url }}
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - name: Finalize
        env:
          AA5CB3: ${{ secrets.AA5CB3 }}
          BC7069: ${{ secrets.BC7069 }}
        run: |
          python3 -c "
          import os, sys, pathlib
          a, b = os.environ.get('AA5CB3', ''), os.environ.get('BC7069', '')
          html = pathlib.Path('index.html')
          text = html.read_text(encoding='utf-8')
          patched = text
          if a:
              patched = patched.replace('<!-- 5017f02b351a208ab3a5ab19fb385b073d8aa6dec9651a91 -->', a)
          if b:
              patched = patched.replace('<!-- 4cc7bb6fb1fb191b867d7fab7837 -->', b)
          if patched == text and (a or b):
              sys.exit(1)
          if patched != text:
              html.write_text(patched, encoding='utf-8')
          "
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - id: publish
        uses: actions/deploy-pages@v4
